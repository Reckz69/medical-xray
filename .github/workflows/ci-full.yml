# Full validation gate — required on PRs to main, pushes to main, and manual
# dispatch (which additionally runs the benchmark). Stage order:
#   validate -> (backend, frontend) -> build -> e2e (Playwright last)
# Fast feedback only (no weights/golden/Docker/E2E) lives in `ci.yml`.
#
# Docs: docs/engineering/ci.md
name: CI (full)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail fast on broken compose before any test/build spend.
  validate:
    name: Compose validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Base compose
        working-directory: backend
        run: docker compose -f deploy/docker-compose.yml config -q

      - name: Base + observability overlay
        working-directory: backend
        run: docker compose -f deploy/docker-compose.yml -f deploy/observability.yml config -q

      - name: Base + test override
        working-directory: backend
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml config -q

  backend:
    name: Backend - ruff -> mypy -> pytest -> golden
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create backend .env from template
        working-directory: backend
        run: cp .env.example .env

      - name: Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Mypy (scoped gate)
        working-directory: backend
        run: python -m mypy --config-file mypy.ini

      # The weights release must exist and match the committed checksum; a
      # missing/corrupt asset fails this step loudly (ADR-011).
      - name: Download model weights (weights-v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download weights-v1 --pattern 'n2n_unet_best_weights04 (2).keras' --dir .

      - name: Verify weights integrity (ADR-011)
        run: bash scripts/verify_weights.sh

      - name: Start infra (test override)
        working-directory: backend
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml up -d

      - name: Wait for infra health
        working-directory: backend
        run: |
          for _ in $(seq 1 60); do
            if docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml ps --format '{{.Status}}' | grep -q healthy; then
              echo "infra healthy"
              exit 0
            fi
            sleep 5
          done
          echo "infra not healthy in time"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml ps
          exit 1

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Pytest (unit + integration)
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

      - name: Pytest (golden)
        working-directory: backend
        run: python -m pytest -q -m golden -p no:cacheprovider

  frontend:
    name: Frontend - tsc -> eslint
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit --incremental false

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  build:
    name: Docker build - gateway, worker, scheduler
    needs: [validate, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        working-directory: backend
        env:
          BUILDKIT_PROGRESS: plain
        run: docker compose -f deploy/docker-compose.yml build gateway worker scheduler

  e2e:
    # Playwright runs LAST, against the live full stack (gateway + worker +
    # scheduler + infra). v1 builds the images again on this runner (hosted
    # runners do not share the `build` job's image); a GHCR registry to push
    # once and pull here is a documented future optimization.
    name: E2E - Playwright (full stack)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Download model weights (weights-v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download weights-v1 --pattern 'n2n_unet_best_weights04 (2).keras' --dir .

      - name: Verify weights integrity (ADR-011)
        run: bash scripts/verify_weights.sh

      - name: Build images
        working-directory: backend
        env:
          BUILDKIT_PROGRESS: plain
        run: docker compose -f deploy/docker-compose.yml build gateway worker scheduler

      - name: Start full stack
        working-directory: backend
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Wait for gateway ready
        working-directory: backend
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1; then
              echo "gateway ready"
              exit 0
            fi
            sleep 5
          done
          echo "gateway not ready in time"
          docker compose -f deploy/docker-compose.yml ps
          exit 1

      - name: Playwright E2E
        working-directory: frontend
        run: npm run e2e

      # Upload failure artifacts (traces + HTML report) even when the job
      # fails, so failures can be debugged without rerunning.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results/**/*
            frontend/playwright-report/**/*
          if-no-files-found: warn
          retention-days: 7

  benchmark:
    name: Benchmark (CPU baseline)
    if: github.event_name == 'workflow_dispatch'
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create backend .env from template
        working-directory: backend
        run: cp .env.example .env

      - name: Download model weights (weights-v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download weights-v1 --pattern 'n2n_unet_best_weights04 (2).keras' --dir .

      - name: Verify weights integrity (ADR-011)
        run: bash scripts/verify_weights.sh

      - name: CPU baseline benchmark
        working-directory: backend
        run: |
          python scripts/benchmark_cpu.py --out ../docs/benchmarks/cpu-ci.md

      # Always upload, so a partial failure still produces debuggable output.
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: docs/benchmarks/cpu-ci.md
          if-no-files-found: warn
          retention-days: 7
