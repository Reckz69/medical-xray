# Fast feedback gate — runs on every push to a sprint branch.
# Faster gates only (no golden, no Docker build, no E2E): the backend job
# still downloads/verifies the weights because the unit + integration suite
# drives the real worker/model; it just skips the heavy golden, build, and
# E2E stages. The full validation gate is `ci-full.yml`, required on PRs to
# main / pushes to main / manual dispatch.
#
# Docs: docs/engineering/ci.md
name: CI (fast)

on:
  push:
    branches:
      - "sprint/**"

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - ruff -> mypy -> pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create backend .env from template
        working-directory: backend
        run: cp .env.example .env

      - name: Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Mypy (scoped gate)
        working-directory: backend
        run: python -m mypy --config-file mypy.ini

      # The unit + integration suite drives the real worker, which loads the
      # model from the repo root (backend/../n2n_unet_best_weights04.keras),
      # so the weights must be present even on the fast gate. A missing or
      # corrupt asset fails this step loudly (ADR-011).
      - name: Download model weights (weights-v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download weights-v1 --pattern 'n2n_unet_best_weights04.keras' --dir .

      - name: Verify weights integrity (ADR-011)
        run: bash scripts/verify_weights.sh

      - name: Start infra (test override)
        working-directory: backend
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml up -d

      - name: Wait for infra health
        working-directory: backend
        run: |
          for _ in $(seq 1 60); do
            if docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml ps --format '{{.Status}}' | grep -q healthy; then
              echo "infra healthy"
              exit 0
            fi
            sleep 5
          done
          echo "infra not healthy in time"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml ps
          exit 1

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Pytest (unit + integration)
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend - tsc -> eslint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit --incremental false

      - name: ESLint
        working-directory: frontend
        run: npm run lint
