# Publish backend images to GHCR (Sprint 4D, ADR-016).
#
# Builds and pushes the three backend images (gateway, worker, scheduler) to
# GitHub Container Registry so production can `docker compose pull` instead of
# building from source (ADR-012 deployment modes).
#
# Triggers: pushes to `main`, `v*` and `sprint-*` tags, and manual dispatch.
# Runs on gated states only (PRs to main / pushes to main must pass ci-full;
# tag pushes point at a main commit that already passed).
#
# Image tagging (ADR-016/ADR-017):
#   ghcr.io/<owner>/<service>:latest           on main and v* tags
#   ghcr.io/<owner>/<service>:<full-sha>       every push (immutable)
#   ghcr.io/<owner>/<service>:v<semver>        on v* tags (release artifact)
#   ghcr.io/<owner>/<service>:sprint-<tag>     on sprint-* tags (sprint boundary)
#
# The owner is `github.repository_owner`: for a user account GHCR only allows
# `ghcr.io/USER/<image>` (no OWNER/REPO nesting) — see ADR-016. Docker image
# references must be lowercase, so the owner is lowercased explicitly with bash
# parameter expansion `${GITHUB_REPOSITORY_OWNER,,}` in the tags step (GHCR
# itself is case-insensitive). GitHub Actions expressions have no `lower()`.
#
# Docs: docs/engineering/ci.md
name: CI (images)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "sprint-*"
  workflow_dispatch:

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, worker, scheduler]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Four explicit tags per ADR-017 (latest / <full-sha> / v<semver> /
      # <sprint-tag>). Comma-joined into the build-push `tags` input.
      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}"
          SHA="${{ github.sha }}"
          TAGS="${IMAGE}:${SHA}"
          case "${{ github.ref }}" in
            refs/heads/main)
              TAGS="${TAGS},${IMAGE}:latest"
              ;;
            refs/tags/sprint-*)
              TAGS="${TAGS},${IMAGE}:${{ github.ref_name }}"
              ;;
            refs/tags/v*)
              TAGS="${TAGS},${IMAGE}:${{ github.ref_name }},${IMAGE}:latest"
              ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=images-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.service }}
