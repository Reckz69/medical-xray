# Scheduler — Deployment + ClusterIP Service + PDB.
# Reference scaffold (deploy/k8s/README.md). A single scheduler replica is
# correct: it uses Redis distributed locks for cleanup, so replicas cooperate
# rather than duplicate work (ADR-009).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: denoise-x
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: denoise-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/Reckz69/scheduler:latest # pin <sha>/v<semver>/<sprint-tag>
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: denoise-x-config
            - secretRef:
                name: denoise-x-secrets
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/
            - name: S3_ENDPOINT
              value: http://minio:9000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: denoise-x
  labels:
    app.kubernetes.io/name: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scheduler
  namespace: denoise-x
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: scheduler
