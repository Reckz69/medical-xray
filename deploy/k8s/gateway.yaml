# Gateway — Deployment + ClusterIP Service + HPA + PDB.
# Reference scaffold (deploy/k8s/README.md). Pin image to a concrete tag
# (ADR-017); placeholders below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: denoise-x
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: denoise-x
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/Reckz69/gateway:latest # pin <sha>/v<semver>/<sprint-tag>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: denoise-x-config
            - secretRef:
                name: denoise-x-secrets
          env:
            # Internal wiring (service DNS names), overriding config/secret values.
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: CORS_ORIGINS
              value: '["https://app.denoise-x.example.com"]'
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: denoise-x
  labels:
    app.kubernetes.io/name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Gateway scales on CPU (HPA). See docs/engineering/scaling.md for design.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: denoise-x
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: denoise-x
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
