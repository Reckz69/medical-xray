# Secrets — PLACEHOLDERS ONLY. Reference scaffold (deploy/k8s/README.md).
#
# Never commit real credentials. In a real cluster, provision these values via
# SealedSecrets (`kubeseal` the values, commit the SealedSecret, let the
# controller create this Secret) or a cloud secret manager synced by a
# controller (ADR-014). The `data` below is base64("CHANGE_ME_<NAME>").
#
# For GHCR pulls, a real cluster also needs a pull credential, e.g.
# `kubectl create secret docker-registry ghcr-pull --docker-server=ghcr.io \
#   --docker-username=<user> --docker-password=<PAT>` (ADR-016).
apiVersion: v1
kind: Secret
metadata:
  name: denoise-x-secrets
  namespace: denoise-x
  labels:
    app.kubernetes.io/name: denoise-x
type: Opaque
data:
  POSTGRES_USER: Q0hBTkdFX01FX1BPU1RHUkVTX1VTRVI=
  POSTGRES_PASSWORD: Q0hBTkdFX01FX1BPU1RHUkVTX1BBU1NXT1JE
  POSTGRES_DB: Q0hBTkdFX01FX1BPU1RHUkVTX0RC
  RABBITMQ_USER: Q0hBTkdFX01FX1JBQkJJVE1RX1VTRVI=
  RABBITMQ_PASS: Q0hBTkdFX01FX1JBQkJJVE1RX1BBU1M=
  MINIO_ROOT_USER: Q0hBTkdFX01FX01JTklPX1VTRVI=
  MINIO_ROOT_PASSWORD: Q0hBTkdFX01FX01JTklPX1BBU1M=
