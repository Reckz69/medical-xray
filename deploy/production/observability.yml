# Denoise X — production observability overlay (Sprint 4D, ADR-012/ADR-010).
#
#   docker compose -f docker-compose.yml -f observability.yml up -d
#
# Merges with the production docker-compose.yml to add the OTel Collector
# (traces), Prometheus (metrics), and Grafana (dashboards), and to switch the
# gateway/worker/scheduler onto OTel tracing + Prometheus scraping. The core
# production stack runs fine without this file — observability stays a
# removable overlay (docs/AI_ENGINEERING_GUIDE.md: the app stack must never
# depend on optional observability infrastructure).
#
# Endpoints (internal only in production — reach them via an SSH tunnel):
#   OTLP/HTTP (traces) : http://otel-collector:4318
#   Prometheus         : http://prometheus:9090
#   Grafana            : http://grafana:3000
#
# The scrape config at backend/infrastructure/prometheus/prometheus.yml uses
# service DNS names (gateway:8000, worker:9101, scheduler:9101), which match
# the production service names unchanged.
services:
  otel-collector:
    image: otel/opentelemetry-collector:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../../backend/infrastructure/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../../backend/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
      - worker
      - scheduler
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.7
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../../backend/infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  gateway:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER: otlp-http
      OTEL_ENDPOINT: http://otel-collector:4318
      METRICS_ENABLED: "true"
    depends_on:
      otel-collector:
        condition: service_started

  worker:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER: otlp-http
      OTEL_ENDPOINT: http://otel-collector:4318
      METRICS_ENABLED: "true"
      METRICS_PORT: "9101"
    depends_on:
      otel-collector:
        condition: service_started

  scheduler:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER: otlp-http
      OTEL_ENDPOINT: http://otel-collector:4318
      METRICS_ENABLED: "true"
      METRICS_PORT: "9101"
    depends_on:
      otel-collector:
        condition: service_started
