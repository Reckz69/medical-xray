[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
check_untyped_defs = True
no_implicit_optional = True
no_site_packages = False

# Phase 1 (Sprint 4B): the observability facade package and the entry points
# that wire it in. Dependencies are treated as Any so legacy / frozen modules
# (converters, model_manager, job_repository, ...) do not gate this phase; a
# repo-wide typing pass is a separate, later effort.
follow_imports = skip
files =
    gateway/core/observability,
    gateway/core/otel.py,
    gateway/core/deps.py,
    gateway/core/config.py,
    gateway/main.py,
    worker/main.py,
    scheduler/main.py,
