[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
check_untyped_defs = True
no_implicit_optional = True
no_site_packages = False

# Phase 1 (Sprint 4B): the observability facade package and the entry points
# that wire it in. Phase 2 adds the instrumented call sites. Phase 3 adds the
# tracepoint-propagation seam (queue) and the worker orchestrator spans.
# Dependencies are treated as Any so legacy / frozen modules (converters,
# model_manager, ...) do not gate this phase; a repo-wide typing pass is a
# separate, later effort.
follow_imports = skip
files =
    gateway/core/observability,
    gateway/core/otel.py,
    gateway/core/deps.py,
    gateway/core/config.py,
    gateway/core/queue.py,
    gateway/main.py,
    gateway/repositories/job_repository.py,
    gateway/domains/scans/service.py,
    worker/main.py,
    worker/executor.py,
    worker/orchestrator.py,
    scheduler/main.py,
    scheduler/retry_jobs.py,
    scheduler/cleanup.py,
