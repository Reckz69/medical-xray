# OpenTelemetry Collector config for the Sprint 4B observability overlay.
#
# App nodes send traces over OTLP/HTTP (:4318) — their OTEL_ENDPOINT is
# http://otel-collector:4318 — and the collector batches then exports them to
# Jaeger (Sprint 4E) AND to the `debug` exporter (stdout), so the full path is
# visible in Jaeger's UI and in:
#
#   docker compose -f docker-compose.yml -f observability.yml \
#     logs -f otel-collector
#
# The collector is the config-only abstraction for the trace backend
# (ADR-010): swapping the backend is a config change only, zero app change.
# For example, to stop exporting to Jaeger and keep only stdout:
#
#   service:
#     pipelines:
#       traces:
#         exporters: [debug]
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic
  otlp_http/jaeger:
    # Jaeger v2 (jaegertracing/jaeger) all-in-one OTLP/HTTP receiver on :4318.
    # otlphttp is OTLP-over-HTTP/1.1; the plain `otlp` exporter defaults to
    # gRPC, which would target Jaeger's gRPC receiver instead (mismatch).
    endpoint: http://jaeger:4318

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/jaeger]
