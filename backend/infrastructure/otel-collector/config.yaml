# OpenTelemetry Collector config for the Sprint 4B observability overlay.
#
# App nodes send traces over OTLP/HTTP (:4318) — their OTEL_ENDPOINT is
# http://otel-collector:4318 — and the collector batches then exports them to
# the `debug` exporter (stdout), so a full end-to-end path is visible in:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/observability.yml \
#     logs -f otel-collector
#
# The collector is the config-only abstraction for the trace backend
# (ADR-010): swapping the backend is a config change only, zero app change.
# For example, to forward to Grafana Tempo instead of the debug exporter:
#
#   exporters:
#     otlp/tempo:
#       endpoint: http://tempo:4318
#       tls:
#         insecure: true
#   service:
#     pipelines:
#       traces:
#         exporters: [otlp/tempo]
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
