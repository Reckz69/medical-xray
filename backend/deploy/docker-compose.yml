# Denoise X development/infra stack.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Starts the full stack: Gateway, Worker, Scheduler, PostgreSQL, Redis,
# RabbitMQ, and MinIO together. All configuration is environment-driven (see
# backend/.env.example); scheduler/retention knobs default to the same values
# the gateway and worker use on the host.
#
# For the pytest integration suite, stop the long-running services first so no
# worker/scheduler competes with the tests:
#   docker compose -f deploy/docker-compose.yml stop worker scheduler gateway
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-denoise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-denoise}
      POSTGRES_DB: ${POSTGRES_DB:-denoise}
    ports:
      - "${POSTGRES_PORT:-5433}:5432" # 5433: the host often has a native postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-denoise} -d ${POSTGRES_DB:-denoise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-denoise}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-denoise}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-denoise-xray};
      mc anonymous set none local/${MINIO_BUCKET:-denoise-xray};
      echo 'bucket ${MINIO_BUCKET:-denoise-xray} ready';
      "

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-denoise}:${POSTGRES_PASSWORD:-denoise}@postgres:5432/${POSTGRES_DB:-denoise}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-denoise}:${RABBITMQ_PASS:-denoise}@rabbitmq:5672/
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET:-denoise-xray}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://127.0.0.1:3000"]}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-denoise}:${POSTGRES_PASSWORD:-denoise}@postgres:5432/${POSTGRES_DB:-denoise}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-denoise}:${RABBITMQ_PASS:-denoise}@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET:-denoise-xray}
      # The gitignored weights are mounted at /weights (see volumes).
      MODEL_PATH: /weights/n2n_unet_best_weights04 (2).keras
    volumes:
      # Compose resolves relative paths from deploy/ (this file's directory),
      # so the gitignored weights at the repo root need the ../../ prefix.
      - ${MODEL_WEIGHTS_PATH:-../../n2n_unet_best_weights04 (2).keras}:/weights/n2n_unet_best_weights04 (2).keras:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-denoise}:${POSTGRES_PASSWORD:-denoise}@postgres:5432/${POSTGRES_DB:-denoise}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-denoise}:${RABBITMQ_PASS:-denoise}@rabbitmq:5672/
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET:-denoise-xray}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-30}
      SCHEDULER_CLEANUP_INTERVAL_SECONDS: ${SCHEDULER_CLEANUP_INTERVAL_SECONDS:-3600}
      SCHEDULER_CLEANUP_LOCK_TTL_SECONDS: ${SCHEDULER_CLEANUP_LOCK_TTL_SECONDS:-3600}
      JOB_STALL_TIMEOUT_SECONDS: ${JOB_STALL_TIMEOUT_SECONDS:-600}
      JOB_RETRY_BACKOFF_BASE_SECONDS: ${JOB_RETRY_BACKOFF_BASE_SECONDS:-30}
      JOB_RETRY_BACKOFF_MAX_SECONDS: ${JOB_RETRY_BACKOFF_MAX_SECONDS:-3600}
      SCAN_PURGE_DAYS: ${SCAN_PURGE_DAYS:-30}
      CLEANUP_BATCH_SIZE: ${CLEANUP_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/scheduler/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
