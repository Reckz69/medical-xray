# Sprint 1 infrastructure: PostgreSQL, Redis, RabbitMQ, MinIO.
#
# The gateway/worker run on the host (uvicorn) against these services.
#   docker compose -f deploy/docker-compose.yml up -d
# The optional `worker` service runs the Sprint 2B async processor in a
# container instead of on the host:
#   docker compose -f deploy/docker-compose.yml up -d worker --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-denoise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-denoise}
      POSTGRES_DB: ${POSTGRES_DB:-denoise}
    ports:
      - "${POSTGRES_PORT:-5433}:5432" # 5433: the host often has a native postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-denoise} -d ${POSTGRES_DB:-denoise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-denoise}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-denoise}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-denoise-xray};
      mc anonymous set none local/${MINIO_BUCKET:-denoise-xray};
      echo 'bucket ${MINIO_BUCKET:-denoise-xray} ready';
      "

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-denoise}:${POSTGRES_PASSWORD:-denoise}@postgres:5432/${POSTGRES_DB:-denoise}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-denoise}:${RABBITMQ_PASS:-denoise}@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET:-denoise-xray}
      # The gitignored weights are mounted at /weights (see volumes).
      MODEL_PATH: /weights/n2n_unet_best_weights04 (2).keras
    volumes:
      - ${MODEL_WEIGHTS_PATH:-../n2n_unet_best_weights04 (2).keras}:/weights/n2n_unet_best_weights04 (2).keras:ro
    depends_on:
      - postgres
      - rabbitmq
      - minio
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
