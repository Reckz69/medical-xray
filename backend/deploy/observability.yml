# Denoise X — observability overlay (Sprint 4B, Phase 4).
#
#   docker compose -f deploy/docker-compose.yml -f deploy/observability.yml up -d --build
#
# Merges with docker-compose.yml to add the observability stack — an OTel
# Collector (traces), Prometheus (metrics scrape), and Grafana (dashboards) —
# and to switch the gateway/worker/scheduler onto OTel tracing + Prometheus
# scraping. The core stack runs fine without this file (observability stays a
# removable overlay; see docs/AI_ENGINEERING_GUIDE.md — "the app stack must
# never depend on optional observability infrastructure").
#
# Endpoints:
#   OTLP/HTTP (traces) : http://localhost:4318
#   Prometheus         : http://localhost:9090
#   Grafana            : http://localhost:3001  (admin / GRAFANA_ADMIN_PASSWORD)
#   Worker/Scheduler   : Prometheus metrics on :9101 inside each container
#   Gateway /metrics   : http://localhost:8000/metrics
services:
  otel-collector:
    image: otel/opentelemetry-collector:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../infrastructure/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP/HTTP — app nodes' OTEL_ENDPOINT
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway
      - worker
      - scheduler
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.7
    environment:
      # Host port 3001 avoids the Next.js dev server on 3000.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  gateway:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER: otlp-http
      OTEL_ENDPOINT: http://otel-collector:4318
      METRICS_ENABLED: "true"
    depends_on:
      otel-collector:
        condition: service_started

  worker:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER: otlp-http
      OTEL_ENDPOINT: http://otel-collector:4318
      METRICS_ENABLED: "true"
      METRICS_PORT: "9101"
    depends_on:
      otel-collector:
        condition: service_started

  scheduler:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER: otlp-http
      OTEL_ENDPOINT: http://otel-collector:4318
      METRICS_ENABLED: "true"
      METRICS_PORT: "9101"
    depends_on:
      otel-collector:
        condition: service_started
